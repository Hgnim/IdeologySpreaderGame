name: Export Godot 4 .NET to Windows

on:
  push:
    tags:
      - 'v*'#开头带v的tag将触发工作流
#  workflow_dispatch:

jobs:
  export-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true #启用lfs支持

      - name: Pull LFS files #拉取lfs中的实际文件
        run: git lfs pull

      # Install the .NET Core workload
      - name: Install .NET Core 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      #安装Godot dotnet和导出模板
      - name: Install Godot .NET and Export Templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.6.2
          use-dotnet: true
          include-templates: true

      #缓存.godot导入文件以加速后续构建
#      - name: Cache .godot imports
#        uses: actions/cache@v4
#        with:
#          path: .godot/
#          key: godot-imports-${{ runner.os }}-${{ hashFiles('**/*.gd', '**/*.cs', '**/*.tscn', '**/*.tres') }}
#          restore-keys: godot-imports-${{ runner.os }}-

      #恢复NuGet包
      - name: Restore NuGet Packages
        run: dotnet restore

      #编译Release模式的C#项目
      - name: Build .NET Project
        run: dotnet build --configuration ExportRelease --no-restore

      #导出
      - name: Export Windows Build
        run: godot --headless --path . --export-release "Windows Desktop"
        env:
          #避免Godot在CI中弹出窗口
          DISPLAY: ""

      #上传构建产物
#      - name: Upload Build files
#        uses: actions/upload-artifact@v4
#        with:
#          name: windows-build_release-${{ github.ref_name }}
#          path: dist/
#          if-no-files-found: error

      #打包
      - name: Package build files
        run: |
          cd dist
          zip -r ../IdeologySpreaderGame_${{ github.ref_name }}-windows.zip .
          cd ..

      #创建Release并上传打包好的内容
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: IdeologySpreaderGame_${{ github.ref_name }}-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}